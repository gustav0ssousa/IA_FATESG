x-backend-common: &backend-common
  image: adaptive-rag-backend:local
  env_file:
    - .env
  environment: &backend-environment
    DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/rag_db
    QDRANT_URL: http://qdrant:6333
    CELERY_BROKER_URL: amqp://rag_user:rag_password@rabbitmq:5672//
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,frontend,embeddings
    EMBEDDING_CACHE_DIR: /home/app/.cache/fastembed
    EMBEDDING_SERVICE_URL: http://embeddings:8000/api/rag/internal/embeddings
    EMBEDDING_SERVICE_ENABLED: "False"
  restart: unless-stopped
  init: true
  networks:
    - backend
    - app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.18.0
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rag_user
      RABBITMQ_DEFAULT_PASS: rag_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - backend

  embedding-cache-init:
    image: alpine:3.22
    command: ["chown", "-R", "10001:10001", "/cache"]
    volumes:
      - embedding_cache:/cache
    restart: "no"
    networks:
      - backend

  embeddings:
    <<: *backend-common
    environment:
      <<: *backend-environment
      EMBEDDING_SERVICE_URL: ""
      EMBEDDING_SERVICE_ENABLED: "True"
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "1"
      - --threads
      - "4"
      - --timeout
      - "240"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    depends_on:
      embedding-cache-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - embedding_cache:/home/app/.cache

  api:
    <<: *backend-common
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend-common
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO
      - --concurrency=1
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

  frontend:
    image: adaptive-rag-frontend:local
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://api:8000
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    init: true
    networks:
      - app

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  embedding_cache:

networks:
  app:
  backend:
    internal: true
