services:
  postgres:
    ports: !reset []

  qdrant:
    ports: !reset []

  api:
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ENVIRONMENT: production
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Defina DJANGO_ALLOWED_HOSTS}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-True}
      API_REQUIRE_AUTHENTICATION: "True"
      API_ACCESS_KEY: ${API_ACCESS_KEY:?Defina API_ACCESS_KEY}
      AUDIT_STORE_QUESTION_TEXT: ${AUDIT_STORE_QUESTION_TEXT:-False}
    ports: !override
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"

  worker:
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ENVIRONMENT: production
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Defina DJANGO_ALLOWED_HOSTS}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY}
      API_REQUIRE_AUTHENTICATION: "True"
      API_ACCESS_KEY: ${API_ACCESS_KEY:?Defina API_ACCESS_KEY}
      AUDIT_STORE_QUESTION_TEXT: ${AUDIT_STORE_QUESTION_TEXT:-False}

  embeddings:
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ENVIRONMENT: production
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Defina DJANGO_ALLOWED_HOSTS}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY}

  frontend:
    environment:
      API_REQUIRE_AUTHENTICATION: "True"
    ports: !override
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
